<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASCII Animals Screensaver</title>
    <link rel="stylesheet" href="screensaver.css" />
  </head>
  <body>
    <canvas id="world" aria-hidden="true"></canvas>
    <canvas id="bokeh" aria-hidden="true"></canvas>

    <!-- Displacement map used by the glass surfaces to bend what's behind them. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="glass-warp" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="4" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="map" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="36" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <!-- Settings mode only: animal picker and settings toggle. -->
    <header class="top-bar">
      <div class="picker glass" id="picker" role="radiogroup" aria-label="Animal">
        <span class="thumb" aria-hidden="true"></span>
      </div>
      <button type="button" class="tweaks-toggle glass" id="tweaksToggle" aria-expanded="false" aria-controls="tweaks">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0" />
          <circle cx="16" cy="6" r="2" />
          <circle cx="10" cy="12" r="2" />
          <circle cx="18" cy="18" r="2" />
        </svg>
        <span data-i18n="settings">Settings</span>
      </button>
    </header>

    <main class="stage">
      <div class="masthead" aria-live="off">
        <p class="date" id="date"></p>
        <p class="time" id="time"></p>
        <p class="greeting" id="greeting"></p>
      </div>
    </main>

    <p class="hint" id="hint" aria-live="polite"></p>

    <aside class="tweaks glass" id="tweaks" hidden aria-labelledby="tweaksTitle">
      <div class="tweaks-head">
        <span class="tweaks-title" id="tweaksTitle" data-i18n="settings">Settings</span>
        <div class="tweaks-actions">
          <button type="button" class="pill" id="tweaksReset" data-i18n="reset">Reset</button>
          <button type="button" class="pill icon" id="tweaksClose" data-i18n-aria="close" aria-label="Close settings">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </div>
      </div>
      <div class="tweaks-body" id="tweaksBody"></div>
    </aside>

    <script src="screensaver.js"></script>
  </body>
</html>
