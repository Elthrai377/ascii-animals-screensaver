# Builds the .deb, checks it installs, and publishes it as a GitHub release.
#
# - Pushing a tag like v1.2.0 runs everything and creates the release.
#   The tag must match __version__ in src/ascii-animals-screensaver.
# - "Run workflow" in the Actions tab (or `gh workflow run release.yml`)
#   builds and checks only; the .deb is kept as a downloadable artifact.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/ascii-animals-screensaver)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME but __version__ is $version. Update src/ascii-animals-screensaver, or fix the tag."
            exit 1
          fi

      - name: Build the .deb
        run: make deb

      - name: Install it on Ubuntu 24.04
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ./dist/*.deb
          ascii-animals-screensaver --version

      - name: Install it on Debian 13
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:trixie sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends /dist/*.deb
            ascii-animals-screensaver --version'

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag pushed again (or a re-run) refreshes the .deb of the existing release.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb \
              --title "ASCII Animals Screensaver ${GITHUB_REF_NAME#v}" \
              --notes-file .github/release-notes.md \
              --generate-notes \
              --verify-tag
          fi
